syntax = "proto3";

package osac.private.v1;

import "cleanapi/cleanapi.proto";
import "google/api/annotations.proto";
import "osac/private/v1/billing_account_type.proto";

option (cleanapi.file).package = "osac.public.v1";
option (cleanapi.file).http_route_prefix_map = "private:fulfillment";

message BillingAccountsListRequest {
  // Index of the first result. If not specified the default value will be zero.
  optional int32 offset = 1;

  // Maximum number of results to be returned by the server. When not specified all the results will be returned. Note
  // that there may not be enough results to return, and that the server may decide, for performance reasons, to return
  // less results than requested.
  optional int32 limit = 2;

  // Filter criteria.
  //
  // The value of this parameter is a [CEL](https://cel.dev) expression used to select which objects to return. The
  // built-in `this` variable refers to the object being tested and `now` refers to the current date and time. If the
  // expression evaluates to `true` the object is included in the results. For example, to retrieve the accounts with a
  // given display name:
  //
  //     this.display_name == "Acme production"
  //
  // If this isn't provided, or if the value is empty, then all the billing accounts are returned. Not all CEL
  // constructs are currently supported for implementation reasons; see the filter documentation (docs/FILTER.md) for
  // the full details.
  optional string filter = 3;

  // Order criteria.
  //
  // The syntax of this parameter is similar to the syntax of the _order by_ clause of a SQL statement, but using the
  // names of the attributes of the account instead of the names of the columns of a table. For example, in order to
  // sort the accounts descending by display name the value should be:
  //
  //     display_name desc
  //
  // If the parameter isn't provided, or if the value is empty, then the order of the results is undefined.
  optional string order = 4;
}

message BillingAccountsListResponse {
  // Actual number of items returned. Note that this may be smaller than the value requested in the `limit` parameter
  // of the request if there are not enough items, or of the system decides that returning that number of items isn't
  // feasible or convenient for performance reasons.
  int32 size = 1;

  // Total number of items of the collection that match the search criteria, regardless of the number of results
  // requested with the `limit` parameter.
  int32 total = 2;

  // List of results.
  repeated BillingAccount items = 3;
}

service BillingAccounts {
  // Lists the accounts of the configured billing provider. The accounts are read from the provider before the list is
  // returned. Fails with `FAILED_PRECONDITION` and reason `BILLING_NOT_CONFIGURED` when billing is disabled, and with
  // `UNAVAILABLE` when the provider cannot be reached. An empty list means that no accounts were discovered; it does
  // not mean that billing is disabled.
  rpc List(BillingAccountsListRequest) returns (BillingAccountsListResponse) {
    option (google.api.http) = {get: "/api/private/v1/billing/accounts"};
  }
}
